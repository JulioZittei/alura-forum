server:
  servlet:
    context-path: /api/v1


spring:
  application:
    name: alura-forum
  profiles:
    active: @activatedProperties@

management:
  endpoints:
    web:
      exposure:
        include: health
  otlp:
    metrics:
      export:
        url: "http://localhost:4318/v1/metrics"
        step: 10s